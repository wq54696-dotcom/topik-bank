# ============================================================
# 사이트 기본 설정
# "바꾸세요" 표시가 있는 줄만 본인 정보로 수정하면 됩니다.
# 이 파일을 수정한 뒤에는 사이트가 다시 빌드될 때까지 1~2분 기다리세요.
# ============================================================

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"   # default, air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

locale: "en-US"
title: "TOPIK Practice Bank"                       # 2026-10-12 사용자 확정: 그대로
subtitle: "Original TOPIK practice questions"
description: "Original TOPIK I and TOPIK II practice questions and question-type guides with English explanations."
url: "https://wq54696-dotcom.github.io"            # 사이트맵·공유 링크용 전체 주소. 도메인 연결 후 "https://topikbank.com"
og_image: "/assets/images/og-default.png"          # 링크 공유 시 미리보기 이미지 (1200×630)
baseurl: "/topik-bank"                             # 저장소 이름과 같게. 개인 도메인 연결 후에는 ""
repository: "wq54696-dotcom/topik-bank"

author:
  name: "Peter Jang"                               # 2026-10-12 사용자 확정
  # 한 줄 소개: 사용자가 정한 문구(논어 학이편). 독자가 외국인이라 영어 풀이를 아래 줄에 덧붙임. 빼려면 <br> 뒤를 지우면 됨
  bio: "남이 나를 알아주지 않는 것을 걱정하지 말고, 내가 남을 제대로 알지 못함을 걱정하라.<br>*Don't worry that others don't know you; worry that you don't know others.*"
  # Gumroad 가입 후 아래 주석(#)을 풀고 주소를 넣으세요. 예시 주소를 그대로 두면 남의 가게로 연결될 수 있습니다.
  # links:
  #   - label: "Gumroad Store"
  #     icon: "fas fa-fw fa-store"
  #     url: "https://내아이디.gumroad.com"

# footer:
#   links:
#     - label: "Gumroad Store"
#       icon: "fas fa-fw fa-store"
#       url: "https://내아이디.gumroad.com"

# 판매 링크 (구독 페이지 등에서 재사용). 비어 있으면 Gumroad 버튼이 숨겨짐
gumroad_store: ""                                  # 바꾸세요: Gumroad 가입 후 "https://내아이디.gumroad.com"

# 댓글: giscus (GitHub Discussions). 설정 방법은 README 참고
comments:
  provider: "giscus"
  giscus:
    repo_id: ""            # 바꾸세요 (giscus.app에서 발급)
    category_name: "Comments"
    category_id: ""        # 바꾸세요
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "light"

# 방문 분석 (선택). Google Analytics 측정 ID를 넣으면 작동
analytics:
  provider: false          # 사용 시 "google-gtag"
  google:
    tracking_id: ""

search: true
search_full_content: false

markdown: kramdown
kramdown:
  input: GFM

permalink: /lessons/:title/
timezone: Asia/Seoul

include:
  - _pages

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# 교재(상품) 페이지 모음
collections:
  shop:
    output: true
    permalink: /shop/:name/

defaults:
  # 레슨 글 기본값
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false   # giscus 설정(repo_id, category_id) 후 true로
      share: true
      related: true
      toc: true
      toc_sticky: true
  # 고정 페이지 기본값
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  # 상품 페이지 기본값
  - scope:
      path: ""
      type: shop
    values:
      layout: single
      author_profile: false
      comments: false
      share: true

category_archive:
  type: liquid
  path: /lessons/
tag_archive:
  type: liquid
  path: /tags/
